<svg viewBox="0 0 1400 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .scenario-box { fill: #ffffff; stroke: #3B82F6; stroke-width: 3; rx: 12; }
      .wifi-bg { fill: #ECFDF5; }
      .tailscale-bg { fill: #FEF3C7; }
      .device-small { fill: #ffffff; stroke: #3B82F6; stroke-width: 2; rx: 6; }
      .fast-line { stroke: #10B981; stroke-width: 4; fill: none; }
      .slow-line { stroke: #F59E0B; stroke-width: 4; fill: none; stroke-dasharray: 10,5; }
      .label-text { font-family: Arial, sans-serif; font-size: 16px; fill: #1F2937; }
      .title-text { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1F2937; }
      .speed-text { font-size: 20px; font-weight: bold; }
      .icon-small { font-size: 30px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="700" y="40" text-anchor="middle" class="title-text">两种连接方式对比</text>

  <!-- WiFi 直连场景 -->
  <rect x="50" y="80" width="550" height="280" class="scenario-box wifi-bg"/>
  <text x="325" y="115" text-anchor="middle" class="label-text" font-size="20px" font-weight="bold">🏠 WiFi 直连</text>
  <text x="325" y="140" text-anchor="middle" class="label-text" font-size="14px" fill="#059669">✅ 推荐：同一 WiFi 网络</text>

  <!-- WiFi 路由器 -->
  <rect x="260" y="160" width="130" height="70" class="device-small"/>
  <text x="325" y="195" text-anchor="middle" class="icon-small">📡</text>
  <text x="325" y="220" text-anchor="middle" class="label-text" font-size="14px">WiFi 路由器</text>

  <!-- Mac -->
  <rect x="100" y="260" width="120" height="85" class="device-small"/>
  <text x="160" y="295" text-anchor="middle" class="icon-small">💻</text>
  <text x="160" y="320" text-anchor="middle" class="label-text" font-size="13px">Mac mini</text>
  <text x="160" y="338" text-anchor="middle" class="label-text" font-size="11px">192.168.1.100</text>

  <!-- iPhone -->
  <rect x="380" y="260" width="120" height="85" class="device-small"/>
  <text x="440" y="295" text-anchor="middle" class="icon-small">📱</text>
  <text x="440" y="320" text-anchor="middle" class="label-text" font-size="13px">iPhone</text>
  <text x="440" y="338" text-anchor="middle" class="label-text" font-size="11px">192.168.1.x</text>

  <!-- 连接线 -->
  <path d="M 160 260 L 305 230" class="fast-line"/>
  <path d="M 440 260 L 345 230" class="fast-line"/>
  <path d="M 220 302 L 380 302" class="fast-line"/>
  <text x="300" y="297" text-anchor="middle" class="speed-text" fill="#10B981">⚡ 快</text>

  <!-- Tailscale 中继场景 -->
  <rect x="650" y="80" width="550" height="280" class="scenario-box tailscale-bg"/>
  <text x="925" y="115" text-anchor="middle" class="label-text" font-size="20px" font-weight="bold">🌏 Tailscale 中继</text>
  <text x="925" y="140" text-anchor="middle" class="label-text" font-size="14px" fill="#D97706">⚠️ NAT 穿透失败时</text>

  <!-- 中继服务器 -->
  <rect x="860" y="160" width="130" height="70" class="device-small"/>
  <text x="925" y="195" text-anchor="middle" class="icon-small">🌏</text>
  <text x="925" y="220" text-anchor="middle" class="label-text" font-size="14px">中继 (HKG)</text>

  <!-- Mac -->
  <rect x="700" y="260" width="120" height="85" class="device-small"/>
  <text x="760" y="295" text-anchor="middle" class="icon-small">💻</text>
  <text x="760" y="320" text-anchor="middle" class="label-text" font-size="13px">Mac mini</text>
  <text x="760" y="338" text-anchor="middle" class="label-text" font-size="11px">100.x.x.x</text>

  <!-- iPhone -->
  <rect x="980" y="260" width="120" height="85" class="device-small"/>
  <text x="1040" y="295" text-anchor="middle" class="icon-small">📱</text>
  <text x="1040" y="320" text-anchor="middle" class="label-text" font-size="13px">iPhone</text>
  <text x="1040" y="338" text-anchor="middle" class="label-text" font-size="11px">100.x.x.x</text>

  <!-- 连接线 -->
  <path d="M 760 260 L 905 230" class="slow-line"/>
  <path d="M 1040 260 L 945 230" class="slow-line"/>
  <path d="M 820 302 L 980 302" class="slow-line"/>
  <text x="900" y="297" text-anchor="middle" class="speed-text" fill="#F59E0B">🐌 慢</text>

  <!-- 性能对比箭头 -->
  <path d="M 600 200 L 650 200" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="625" y="190" text-anchor="middle" class="label-text" font-size="13px" fill="#6B7280">网络切换</text>

  <!-- 优缺点和访问地址（分开两列，避免堆叠） -->
  <!-- WiFi 左侧：特点 -->
  <text x="70" y="395" class="label-text" font-size="14px" font-weight="bold">特点：</text>
  <text x="70" y="418" class="label-text" font-size="13px" fill="#059669">✅ 延迟低（秒回）</text>
  <text x="70" y="438" class="label-text" font-size="13px" fill="#059669">✅ 速度快（直连）</text>
  <text x="70" y="458" class="label-text" font-size="13px" fill="#DC2626">❌ 仅限同一网络</text>

  <!-- WiFi 右侧：访问地址 -->
  <text x="320" y="395" class="label-text" font-size="14px" font-weight="bold">访问地址：</text>
  <text x="320" y="418" class="label-text" font-size="13px">http://192.168.1.100:8080</text>

  <!-- Tailscale 左侧：特点 -->
  <text x="670" y="395" class="label-text" font-size="14px" font-weight="bold">特点：</text>
  <text x="670" y="418" class="label-text" font-size="13px" fill="#F59E0B">⚠️ 延迟高（10-30秒）</text>
  <text x="670" y="438" class="label-text" font-size="13px" fill="#F59E0B">⚠️ 流式响应可能中断</text>
  <text x="670" y="458" class="label-text" font-size="13px" fill="#059669">✅ 全球任何地方可用</text>

  <!-- Tailscale 右侧：访问地址 -->
  <text x="920" y="395" class="label-text" font-size="14px" font-weight="bold">访问地址：</text>
  <text x="920" y="418" class="label-text" font-size="13px">http://100.x.x.x:8080</text>

  <!-- 使用建议（移到更下方，避免堆叠） -->
  <rect x="50" y="490" width="1150" height="220" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3" rx="12"/>
  <text x="625" y="525" text-anchor="middle" class="label-text" font-size="20px" font-weight="bold">💡 使用建议</text>

  <!-- 场景对比表格 -->
  <rect x="100" y="550" width="480" height="130" fill="#ffffff" stroke="#CBD5E1" stroke-width="2" rx="8"/>
  <text x="120" y="580" class="label-text" font-size="15px" font-weight="bold">🏠 在家/公司（同一 WiFi）</text>
  <text x="120" y="608" class="label-text" font-size="14px">➜ 优先使用 WiFi 直连</text>
  <text x="120" y="632" class="label-text" font-size="14px">➜ http://192.168.1.100:8080</text>
  <text x="120" y="658" class="label-text" font-size="13px" fill="#10B981">✅ 速度快，体验好</text>

  <rect x="620" y="550" width="480" height="130" fill="#ffffff" stroke="#CBD5E1" stroke-width="2" rx="8"/>
  <text x="640" y="580" class="label-text" font-size="15px" font-weight="bold">🌍 外出/远程（不同网络）</text>
  <text x="640" y="608" class="label-text" font-size="14px">➜ 使用 Tailscale</text>
  <text x="640" y="632" class="label-text" font-size="14px">➜ http://100.x.x.x:8080</text>
  <text x="640" y="658" class="label-text" font-size="13px" fill="#F59E0B">⚠️ 可能较慢，但能用</text>

  <!-- 底部说明 -->
  <text x="625" y="705" text-anchor="middle" class="label-text" font-size="14px" fill="#6B7280">💡 Tip: 两种方式可以同时使用，根据网络环境选择</text>
</svg>
