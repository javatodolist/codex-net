<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <title>BMAD + Ralph Loop 完整工作流程</title>
  <desc>展示从 BMAD 规划到 Ralph 执行到人工检查的完整开发流程</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <!-- 渐变背景 -->
    <linearGradient id="gradPlan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradExec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ECFDF5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1FAE5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradReview" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1400" height="900" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="700" y="40" font-family="Inter, SF Pro Display, system-ui, sans-serif"
        font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">
    BMAD + Ralph Loop 完整工作流程
  </text>

  <!-- ========== 阶段1: BMAD 规划阶段 ========== -->
  <g id="planning-phase">
    <!-- 泳道背景 -->
    <rect x="50" y="80" width="400" height="500" rx="16" fill="url(#gradPlan)" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>

    <!-- 泳道标题 -->
    <text x="250" y="115" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1E40AF" text-anchor="middle">
      BMAD 规划阶段
    </text>

    <!-- 需求分析 -->
    <rect x="100" y="140" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="250" y="175" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">需求分析</text>

    <line x1="250" y1="200" x2="250" y2="230" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 生成 Epic -->
    <rect x="100" y="230" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="250" y="265" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">生成 Epic（史诗）</text>

    <line x1="250" y1="290" x2="250" y2="320" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 拆分用户故事 -->
    <rect x="100" y="320" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="250" y="355" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">拆分用户故事</text>

    <line x1="250" y1="380" x2="250" y2="410" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 生成故事文件 -->
    <rect x="100" y="410" width="300" height="80" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="250" y="440" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">生成故事文件</text>
    <text x="250" y="460" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">包含 AC（验收标准）</text>
    <text x="250" y="477" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">和 Tasks（任务清单）</text>

    <!-- 输出图标 -->
    <rect x="100" y="510" width="300" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="250" y="540" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748B" text-anchor="middle">
      📄 _bmad-output/implementation-artifacts/
    </text>
  </g>

  <!-- ========== 阶段2: Ralph 执行阶段 ========== -->
  <g id="execution-phase">
    <!-- 泳道背景 -->
    <rect x="500" y="80" width="450" height="650" rx="16" fill="url(#gradExec)" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>

    <!-- 泳道标题 -->
    <text x="725" y="115" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#047857" text-anchor="middle">
      Ralph Loop 执行阶段
    </text>

    <!-- 启动后台会话 -->
    <rect x="575" y="140" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="725" y="168" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">启动后台会话</text>
    <text x="725" y="190" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748B" text-anchor="middle">tmux + caffeinate</text>

    <line x1="450" y1="450" x2="575" y2="175" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

    <line x1="725" y1="210" x2="725" y2="250" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Ralph Loop 读取故事 -->
    <rect x="575" y="250" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="725" y="285" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">Ralph Loop 读取故事</text>

    <line x1="725" y1="310" x2="725" y2="340" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 实现功能 -->
    <rect x="575" y="340" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="725" y="375" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">实现功能代码</text>

    <line x1="725" y1="400" x2="725" y2="430" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 运行测试 -->
    <rect x="575" y="430" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="725" y="465" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">运行测试</text>

    <line x1="725" y1="490" x2="725" y2="530" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 测试通过决策 -->
    <path d="M 725 530 L 795 570 L 725 610 L 655 570 Z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="725" y="575" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">测试通过?</text>

    <!-- 失败循环 -->
    <path d="M 655 570 Q 550 570 550 370 Q 550 370 575 370" stroke="#EF4444" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
    <text x="520" y="470" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#EF4444">失败</text>

    <line x1="725" y1="610" x2="725" y2="640" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="745" y="628" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">成功</text>

    <!-- 勾选 Tasks -->
    <rect x="575" y="640" width="300" height="50" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="725" y="670" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">✓ 勾选 Tasks</text>

    <!-- 更新状态 -->
    <rect x="575" y="550" width="300" height="50" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="725" y="580" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">更新 Status = done</text>

    <line x1="725" y1="690" x2="725" y2="720" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 还有故事决策 -->
    <path d="M 725 720 L 795 760 L 725 800 L 655 760 Z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="725" y="765" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">还有故事?</text>

    <!-- 循环到下一个故事 -->
    <path d="M 795 760 Q 920 760 920 280 Q 920 280 875 280" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
    <text x="935" y="520" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#F59E0B">是</text>

    <!-- Epic 完成 -->
    <ellipse cx="725" cy="850" rx="100" ry="35" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <text x="725" y="858" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#047857" text-anchor="middle">Epic 完成 ✓</text>

    <line x1="725" y1="800" x2="725" y2="815" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="695" y="810" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">否</text>
  </g>

  <!-- ========== 阶段3: 人工检查 ========== -->
  <g id="review-phase">
    <!-- 泳道背景 -->
    <rect x="1000" y="80" width="350" height="400" rx="16" fill="url(#gradReview)" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>

    <!-- 泳道标题 -->
    <text x="1175" y="115" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#D97706" text-anchor="middle">
      人工检查阶段
    </text>

    <line x1="825" y1="850" x2="1075" y2="180" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Code Review -->
    <rect x="1050" y="150" width="250" height="60" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1175" y="185" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">Code Review</text>

    <line x1="1175" y1="210" x2="1175" y2="250" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 质量验收 -->
    <rect x="1050" y="250" width="250" height="60" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1175" y="285" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">质量验收</text>

    <line x1="1175" y1="310" x2="1175" y2="350" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 合并代码 -->
    <rect x="1050" y="350" width="250" height="70" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="1175" y="378" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">合并代码</text>
    <text x="1175" y="398" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748B" text-anchor="middle">git merge</text>

    <!-- 发布到生产 -->
    <ellipse cx="1175" cy="455" rx="95" ry="32" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <text x="1175" y="463" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#047857" text-anchor="middle">发布到生产 🚀</text>

    <line x1="1175" y1="420" x2="1175" y2="423" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- 流程说明 -->
  <g id="notes">
    <rect x="50" y="620" width="420" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="70" y="645" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1E293B">
      核心优势
    </text>
    <text x="70" y="670" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">
      1. BMAD 生成详细的故事文件，AI 不需要猜测需求
    </text>
    <text x="70" y="690" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">
      2. Ralph Loop 自动迭代，无需人工干预
    </text>
    <text x="70" y="710" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">
      3. 后台运行，可同时处理多个 Epic
    </text>
  </g>

  <!-- 统计数据 -->
  <g id="stats">
    <rect x="1000" y="520" width="350" height="140" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="1020" y="545" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1E293B">
      实际数据（基于真实使用）
    </text>
    <text x="1020" y="570" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">
      • Epic（6个故事）：约 4 小时
    </text>
    <text x="1020" y="590" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">
      • Epic（8个故事）：约 6 小时
    </text>
    <text x="1020" y="610" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">
      • 成功率：约 85%
    </text>
    <text x="1020" y="630" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">
      • API 成本：$20-30 / Epic
    </text>
  </g>
</svg>
