<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <title>tmux 后台运行完整流程</title>
  <desc>展示从创建 tmux 会话到任务完成的完整操作流程</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrowDecision" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="600" y="40" font-family="Inter, SF Pro Display, system-ui, sans-serif"
        font-size="26" font-weight="700" fill="#1E293B" text-anchor="middle">
    tmux 后台运行完整流程
  </text>

  <!-- 阶段1: 初始化 -->
  <g id="stage1">
    <!-- 开始 -->
    <ellipse cx="150" cy="120" rx="70" ry="30" fill="#E0F2FE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="128" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">开始</text>

    <line x1="150" y1="150" x2="150" y2="200" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 创建会话 -->
    <rect x="50" y="200" width="200" height="80" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="230" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">创建 tmux 会话</text>
    <text x="150" y="250" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">tmux new -s</text>
    <text x="150" y="268" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">ralph-epic1</text>
  </g>

  <!-- 阶段2: 执行 -->
  <g id="stage2">
    <line x1="250" y1="240" x2="350" y2="240" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 运行 Claude -->
    <rect x="350" y="200" width="200" height="80" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <text x="450" y="230" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">运行 Claude Code</text>
    <text x="450" y="250" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">cd project</text>
    <text x="450" y="268" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">claude</text>

    <line x1="550" y1="240" x2="650" y2="240" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 执行 Ralph Loop -->
    <rect x="650" y="200" width="200" height="80" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <text x="750" y="230" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">执行 Ralph Loop</text>
    <text x="750" y="250" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">/ralph-loop</text>
    <text x="750" y="268" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">"任务..." --max 100</text>

    <line x1="850" y1="240" x2="950" y2="240" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 分离会话 -->
    <rect x="950" y="200" width="200" height="80" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <text x="1050" y="230" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">分离会话</text>
    <text x="1050" y="250" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">按 Ctrl+B</text>
    <text x="1050" y="268" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">然后按 D</text>
  </g>

  <!-- 阶段3: 后台运行与监控 -->
  <g id="stage3">
    <line x1="1050" y1="280" x2="1050" y2="360" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 决策点: 需要查看进度? -->
    <path d="M 1050 360 L 1150 420 L 1050 480 L 950 420 Z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <text x="1050" y="420" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">需要查看</text>
    <text x="1050" y="438" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">进度?</text>

    <!-- 是: 重新连接 -->
    <line x1="950" y1="420" x2="750" y2="420" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowDecision)"/>
    <text x="850" y="410" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F59E0B">是</text>

    <rect x="550" y="380" width="200" height="80" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <text x="650" y="410" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">重新连接会话</text>
    <text x="650" y="430" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">tmux attach -t</text>
    <text x="650" y="448" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">ralph-epic1</text>

    <line x1="650" y1="460" x2="650" y2="520" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowDecision)"/>

    <!-- 查看状态 -->
    <rect x="550" y="520" width="200" height="60" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <text x="650" y="555" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">查看执行状态</text>

    <!-- 循环回到决策点 -->
    <path d="M 750 550 Q 850 550 850 420 Q 850 420 950 420" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrowDecision)" stroke-dasharray="3,3"/>

    <!-- 否: 等待完成 -->
    <line x1="1050" y1="480" x2="1050" y2="560" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1070" y="520" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#3B82F6">否</text>

    <rect x="950" y="560" width="200" height="60" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <text x="1050" y="595" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">等待任务完成</text>
  </g>

  <!-- 阶段4: 完成 -->
  <g id="stage4">
    <line x1="950" y1="590" x2="750" y2="590" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 查看结果 -->
    <rect x="550" y="620" width="200" height="60" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <text x="650" y="655" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">查看最终结果</text>

    <line x1="550" y1="650" x2="400" y2="650" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 关闭会话 -->
    <rect x="200" y="620" width="200" height="60" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <text x="300" y="645" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">关闭会话</text>
    <text x="300" y="665" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#64748B" text-anchor="middle">tmux kill-session</text>

    <line x1="300" y1="680" x2="300" y2="730" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 结束 -->
    <ellipse cx="300" cy="750" rx="70" ry="30" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <text x="300" y="758" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">结束</text>
  </g>

  <!-- 阶段标注 -->
  <g id="labels">
    <text x="150" y="180" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">1. 初始化</text>
    <text x="750" y="180" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">2. 执行任务</text>
    <text x="1050" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">3. 后台运行</text>
    <text x="300" y="600" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">4. 完成清理</text>
  </g>

  <!-- 提示框 -->
  <rect x="50" y="730" width="500" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="758" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">
    💡 提示：分离后任务继续运行，可随时重连查看进度
  </text>
</svg>
